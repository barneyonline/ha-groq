[project]
name = "ha-groq"
version = "1.0"
requires-python = ">=3.14"

[tool.ruff]
# Ruff does not expose a py314 target yet. The package still requires Python
# 3.14; this parser target should move to py314 once Ruff adds it.
target-version = "py313"

[tool.black]
# Keep Black aligned with Ruff until Ruff exposes py314; otherwise Black emits
# Python 3.14 syntax that Ruff cannot parse yet.
target-version = ["py313"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/groq"]
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  # These third-party validation packages do not provide complete typing metadata.
  "jsonschema",
  "referencing.*",
]
ignore_missing_imports = true
