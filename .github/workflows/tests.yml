name: Tests

on:
  pull_request:
    paths:
      - "custom_components/groq/**"
      - "tests/components/groq/**"
      - "tests/scripts/**"
      - ".pre-commit-config.yaml"
      - ".ruff.toml"
      - "pyproject.toml"
      - "devtools/docker/**"
      - "hacs.json"
      - "quality_scale.yaml"
      - "scripts/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ format('{0}-{1}', github.workflow_ref || github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Authenticate Codecov uploads without repository or Dependabot secrets.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .test-cache/pre-commit
          key: ${{ runner.os }}-${{ runner.arch }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'devtools/docker/Dockerfile', 'devtools/docker/requirements-*.txt', 'scripts/verify_test_environment.py') }}
      - name: Build and start Home Assistant test environment
        run: scripts/test --prepare
      - name: Verify Home Assistant dependencies
        run: scripts/test python -m pip check
      - name: Run pre-commit in Home Assistant Docker
        run: scripts/test pre-commit run --all-files
      - name: Validate quality scale evidence in Home Assistant Docker
        run: |
          scripts/test python scripts/validate_quality_scale.py
          scripts/test python -m pytest -q tests/scripts/test_validate_quality_scale.py
      - name: Gate integration import deprecations in Home Assistant Docker
        run: >
          scripts/test python scripts/importtime_profile.py
          --strict-integration-warnings
          --output importtime-groq.log
      - name: Upload import-time profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: importtime-groq
          path: importtime-groq.log
      - name: Run strict typing in Home Assistant Docker
        run: scripts/strict-typing
      - name: Verify real Home Assistant typing contracts
        run: scripts/test python scripts/check_ha_typing.py
      - name: Detect changed integration modules
        if: ${{ github.event_name == 'pull_request' }}
        id: changed
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t changed < <(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "custom_components/groq/*.py" |
            while IFS= read -r path; do
              [ -f "$path" ] && printf '%s\n' "$path"
            done
          )
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed integration Python modules; skipping targeted coverage."
            echo "include=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          include=$(IFS=,; echo "${changed[*]}")
          echo "include=${include}" >> "$GITHUB_OUTPUT"
      - name: Run tests with coverage in Home Assistant Docker
        id: pytest
        continue-on-error: true
        run: >
          scripts/test python -m pytest
          --cov=custom_components.groq
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
          --junitxml=junit.xml
          -o junit_family=legacy
      - name: Enforce 100% coverage on changed integration modules
        if: ${{ github.event_name == 'pull_request' && steps.pytest.outcome == 'success' && steps.changed.outputs.include != '' }}
        run: >
          scripts/test python -m coverage report -m
          --include='${{ steps.changed.outputs.include }}'
          --fail-under=100
      - name: Upload coverage to Codecov
        if: ${{ (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          use_oidc: true
          files: ./junit.xml
          report_type: test_results
      - name: Fail if tests failed
        if: ${{ steps.pytest.outcome == 'failure' }}
        run: exit 1

  minimum-homeassistant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and verify minimum Home Assistant environment
        run: scripts/test --minimum --prepare
      - name: Verify minimum Home Assistant dependencies
        run: scripts/test --minimum python -m pip check
      - name: Verify minimum Home Assistant typing contracts
        run: scripts/test --minimum python scripts/check_ha_typing.py
      - name: Run component tests against minimum Home Assistant
        run: scripts/test --minimum python -m pytest tests/components/groq -q
