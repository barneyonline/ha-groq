name: Coverage Reporting

# Test jobs have no reporting credentials. This default-branch workflow only
# reads Git metadata without checking out or executing candidate files.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions: {}

concurrency:
  group: coverage-reporting-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Resolve report artifact and source attribution
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.repository.id !== context.payload.repository.id ||
                run.path !== '.github/workflows/tests.yml' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Unexpected report producer');
            }
            let prNumber = '';
            let branch = run.head_branch;
            if (run.event === 'pull_request') {
              // Fork runs can lack both workflow_run.pull_requests and a
              // base-repository commit association. Query the base PR inventory
              // by producer owner/branch, then require the exact current head.
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`, per_page: 100,
              });
              const matches = pulls.filter(pr => pr.base.repo.id === run.repository.id &&
                pr.head.repo?.id === run.head_repository.id &&
                pr.head.ref === run.head_branch &&
                pr.head.sha === run.head_sha &&
                pr.state === 'open');
              if (matches.length !== 1) {
                core.notice('No unique current pull request for this producer commit; skipping reports');
                return;
              }
              prNumber = String(matches[0].number);
              branch = matches[0].head.ref;
            } else if (run.head_repository.id !== run.repository.id ||
                       (branch !== 'main' && !branch.startsWith('release/'))) {
              throw new Error('Unexpected push report source');
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$/.test(branch)) {
              throw new Error('Report branch contains unsupported characters');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            const matches = artifacts.filter(artifact =>
              artifact.name === `coverage-evidence-${run.run_attempt}` && !artifact.expired);
            if (!matches.length) {
              if (run.conclusion !== 'success') throw new Error('Failed producer did not preserve reports');
              core.notice('This change did not produce coverage reports');
              return;
            }
            if (matches.length !== 1 || matches[0].size_in_bytes > 33554432) {
              throw new Error('Unexpected report artifact count or size');
            }
            core.setOutput('artifact_id', String(matches[0].id));
            core.setOutput('sha', run.head_sha);
            core.setOutput('branch', branch);
            core.setOutput('pr', prNumber);
      - name: Prepare the verified Git inventory without a source checkout
        if: ${{ steps.source.outputs.artifact_id != '' }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CODECOV_SOURCE: ${{ runner.temp }}/codecov-source
        run: |
          mkdir -m 700 "$CODECOV_SOURCE" "$RUNNER_TEMP/codecov-work"
          git init --quiet "$CODECOV_SOURCE"
          git -C "$CODECOV_SOURCE" -c core.hooksPath=/dev/null fetch \
            --filter=blob:none --depth=1 --no-tags "$SOURCE_URL" "$SOURCE_SHA"
          test "$(git -C "$CODECOV_SOURCE" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          # read-tree updates only Git's index; no -u and no candidate checkout.
          git -C "$CODECOV_SOURCE" -c core.hooksPath=/dev/null read-tree FETCH_HEAD
          git -C "$CODECOV_SOURCE" -c core.hooksPath=/dev/null update-ref HEAD "$SOURCE_SHA"
      - name: Download only the selected producer reports
        if: ${{ steps.source.outputs.artifact_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate report files
        if: ${{ steps.source.outputs.artifact_id != '' }}
        env:
          REPORTS: ${{ runner.temp }}/reports
        run: |
          python3 - <<'PYTHON'
          import os
          import stat
          from pathlib import Path
          root = Path(os.environ['REPORTS'])
          entries = list(root.rglob('*'))
          required = {'coverage.xml', 'junit.xml'}
          names = {entry.name for entry in entries}
          if not required <= names or names - (required | {'coverage.json'}):
              raise SystemExit('Unexpected report artifact contents')
          total = 0
          for path in entries:
              info = path.lstat()
              if path.parent != root or not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                  raise SystemExit('Reports must be regular files at the artifact root')
              if not 0 < info.st_size <= 16777216:
                  raise SystemExit('Report file budget exceeded')
              total += info.st_size
          if total > 33554432:
              raise SystemExit('Report aggregate budget exceeded')
          PYTHON
      - name: Upload coverage to Codecov
        id: coverage_upload
        if: ${{ steps.source.outputs.artifact_id != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        env:
          GIT_DIR: ${{ runner.temp }}/codecov-source/.git
          GIT_WORK_TREE: ${{ runner.temp }}/codecov-source
        with:
          use_oidc: true
          files: ${{ runner.temp }}/reports/coverage.xml
          root_dir: ${{ runner.temp }}/codecov-source
          network_filter: custom_components/groq/
          working-directory: ${{ runner.temp }}/codecov-work
          name: coverage-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          plugins: noop
          disable_search: true
          disable_file_fixes: true
          override_commit: ${{ steps.source.outputs.sha }}
          override_branch: ${{ steps.source.outputs.branch }}
          override_pr: ${{ steps.source.outputs.pr }}
          override_build: ${{ github.event.workflow_run.id }}.${{ github.event.workflow_run.run_attempt }}
          override_build_url: ${{ github.event.workflow_run.html_url }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        id: junit_upload
        if: ${{ steps.source.outputs.artifact_id != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        env:
          GIT_DIR: ${{ runner.temp }}/codecov-source/.git
          GIT_WORK_TREE: ${{ runner.temp }}/codecov-source
        with:
          use_oidc: true
          files: ${{ runner.temp }}/reports/junit.xml
          root_dir: ${{ runner.temp }}/codecov-source
          network_filter: custom_components/groq/
          working-directory: ${{ runner.temp }}/codecov-work
          name: junit-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          job_code: junit-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          report_type: test_results
          plugins: noop
          disable_file_fixes: true
          disable_search: true
          override_commit: ${{ steps.source.outputs.sha }}
          override_branch: ${{ steps.source.outputs.branch }}
          override_pr: ${{ steps.source.outputs.pr }}
          override_build: ${{ github.event.workflow_run.id }}.${{ github.event.workflow_run.run_attempt }}
          override_build_url: ${{ github.event.workflow_run.html_url }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
      - name: Verify processed coverage and test results for this attempt
        if: ${{ steps.source.outputs.artifact_id != '' && steps.coverage_upload.outcome == 'success' && steps.junit_upload.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
          sha = os.environ['SOURCE_SHA']
          run, attempt = os.environ['SOURCE_RUN_ID'], os.environ['SOURCE_RUN_ATTEMPT']
          base = f'https://api.codecov.io/api/v2/github/{owner}/repos/{repo}/commits/{sha}/'

          def read(url):
              # Public repository API; never send GitHub or OIDC credentials.
              with urllib.request.urlopen(url, timeout=15) as response:
                  return json.load(response)

          retries = 0
          for poll in range(12):
              try:
                  commit = read(base + '?format=json')
                  uploads, url = [], base + 'uploads/?format=json&page_size=100'
                  for page in range(10):
                      result = read(url)
                      uploads.extend(result['results'])
                      url = result.get('next')
                      if not url:
                          break
                      if not url.startswith(base + 'uploads/?'):
                          raise SystemExit('Unexpected Codecov pagination URL')
                  else:
                      raise SystemExit('Codecov pagination budget exceeded')
                  coverage = [u for u in uploads if u.get('name') == f'coverage-{run}-{attempt}']
                  junit = [u for u in uploads if u.get('job_code') == f'junit-{run}-{attempt}']
                  if any(u.get('state') in {'error', 'failed'} for u in coverage + junit):
                      raise SystemExit('Codecov rejected this attempt')
                  nonempty = lambda totals: bool(totals and totals.get('files', 0) > 0 and totals.get('lines', 0) > 0)
                  if (commit.get('commitid') == sha and commit.get('state') == 'complete'
                      and nonempty(commit.get('totals')) and (commit.get('report') or {}).get('files')
                      and any(u.get('state') == 'merged' and nonempty(u.get('totals')) for u in coverage)
                      and any(u.get('state') == 'processed' for u in junit)):
                      print(f'Codecov processed coverage and JUnit for {sha}, producer {run}.{attempt}')
                      break
              except urllib.error.HTTPError as error:
                  error.close()
                  if error.code != 404:
                      if error.code not in {429, 500, 502, 503, 504} or retries >= 2:
                          raise
                      retries += 1
              if poll < 11:
                  time.sleep(10)
          else:
              raise SystemExit('Timed out waiting for processed coverage and JUnit')
          PYTHON
