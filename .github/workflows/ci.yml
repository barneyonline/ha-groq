name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/groq/**"
      - "tests/components/groq/**"
      - "tests/scripts/**"
      - ".pre-commit-config.yaml"
      - ".ruff.toml"
      - "pyproject.toml"
      - "pytest.ini"
      - "codecov.yml"
      - "devtools/docker/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
