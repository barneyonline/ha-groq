[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    # HA 2026.11.0 keeps this string key for backward compatibility. Review
    # this exact upstream exception when updating the pinned Core image.
    ignore:^It is recommended to use web\.AppKey instances for keys\.\nhttps\x3a//docs\.aiohttp\.org/en/stable/web_advanced\.html#application-s-config$:aiohttp.web_exceptions.NotAppKeyWarning:^homeassistant\.components\.http\.server$
    # Core 2026.12.0b2's pytest helper imports these upstream modules at startup.
    # Recheck the filters when updating the compatibility pin.
    ignore:^Inheritance class HomeAssistantApplication from web\.Application is discouraged$:DeprecationWarning:^homeassistant\.components\.http\.server$
    ignore:^'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead$:DeprecationWarning:^backoff\._(async|decorator)$
