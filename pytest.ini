[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    # HA 2026.10.0 keeps this string key for backward compatibility. Review
    # this exact upstream exception when updating the pinned Core image.
    ignore:^It is recommended to use web\.AppKey instances for keys\.\nhttps\x3a//docs\.aiohttp\.org/en/stable/web_advanced\.html#application-s-config$:aiohttp.web_exceptions.NotAppKeyWarning:^homeassistant\.components\.http\.server$
