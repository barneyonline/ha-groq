services:
  ha-dev:
    image: ${HA_GROQ_TEST_IMAGE:-ha-groq-dev:local}
    build:
      context: ../..
      dockerfile: devtools/docker/Dockerfile
      args:
        HA_IMAGE: ${HA_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.9.0@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293}
        REQUIREMENTS_FILE: ${HA_GROQ_REQUIREMENTS_FILE:-requirements-dev.txt}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        TEST_ENVIRONMENT_HASH: ${HA_GROQ_TEST_ENVIRONMENT_HASH:-manual}
    volumes:
      - ../..:/workspace:delegated
      - ${HA_GROQ_GIT_COMMON_DIR:-../../.git}:${HA_GROQ_GIT_COMMON_DIR:-/workspace/.git}
      - ../../.test-cache/pre-commit:/root/.cache/pre-commit
    working_dir: /workspace
    command: sleep infinity
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTEST_DISABLE_PLUGIN_AUTOLOAD=1

  ha-runtime:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:56690a89c79a0de98035e1719f8324a92d5859c1192ff45adb0230ea81cb42a5
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ../../.ha-config:/config
      - ../../custom_components/groq:/config/custom_components/groq:ro
